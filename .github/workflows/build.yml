name: Build
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    
    steps:      
      - name: Get CPM
        uses: neacsum/configurator@v0.0.11
        with:
          name: cpm.exe
          url: https://github.com/neacsum/cpm/releases/latest/download/cpm.exe
      
      - name: Build
        run: cpm -v -u https://github.com/neacsum/example_super_app
        
      - name: Run app
        run: |
          cd {{github.workspace}}
          .\super_app\build\x64\Release\super_app.exe
